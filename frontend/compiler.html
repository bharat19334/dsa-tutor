<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compiler — DSA Visual Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>

<div class="scanline"></div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand brand">
      <span class="brand-prompt">&gt;_</span>
      <span class="brand-name">dsa<span class="brand-accent">.tutor</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link"><span class="num">01</span> Dashboard</a>
      <a href="practice.html" class="sidebar-link"><span class="num">02</span> Practice <span class="soon">soon</span></a>
      <a href="progress.html" class="sidebar-link"><span class="num">03</span> Progress <span class="soon">soon</span></a>
      <a href="history.html" class="sidebar-link"><span class="num">04</span> History <span class="soon">soon</span></a>
      <a href="compiler.html" class="sidebar-link active"><span class="num">05</span> Compiler</a>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle"></button>
      <span id="userGreeting" class="user-greeting"></span>
      <button id="logoutBtn" class="btn-step">logout</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar topbar-slim">
      <div class="topbar-status"><span class="dot dot-idle"></span> compiler</div>
    </header>

    <main class="wrap">

  <section class="panel compiler-panel">
    <div class="panel-label-row">
      <div class="panel-label">CODE &amp; RUN</div>
      <select id="codeLangSelect" class="speed-select">
        <option value="Python">Python</option>
        <option value="C++">C++</option>
        <option value="Java">Java</option>
        <option value="JavaScript">JavaScript</option>
      </select>
    </div>
    <textarea id="codeEditor" class="code-editor" spellcheck="false" placeholder="// write your code here...">print("Hello, DSA!")</textarea>

    <div class="stdin-row">
      <label class="stdin-label" for="stdinInput">stdin (optional input)</label>
      <textarea id="stdinInput" class="stdin-editor" spellcheck="false" placeholder="input values here, one per line if needed..."></textarea>
    </div>

    <button id="runCodeBtn" class="btn-run">
      <span class="btn-run-text">▶ run code</span>
      <span class="btn-run-key">⏎</span>
    </button>

    <div id="codeOutput" class="code-output hidden">
      <div class="output-header">
        <span id="outputStatus" class="output-status"></span>
        <span id="outputMeta" class="output-meta"></span>
      </div>
      <pre id="outputStdout" class="output-block"></pre>
      <pre id="outputStderr" class="output-block output-error hidden"></pre>
    </div>
  </section>

  <div id="errorBox" class="error-box hidden"></div>

    </main>
  </div>
</div>

<script src="compiler.js"></script>
</body>
</html>
